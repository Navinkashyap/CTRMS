services:
  - type: web
    name: ctrms-backend
    env: node
    buildCommand: cd Backend && npm install
    startCommand: cd Backend && npm start
    envVars:
      # Set these in the Render dashboard (Environment tab) instead of here —
      # never commit real credentials to this file. MONGODB_URI's password
      # was previously committed in plaintext and MUST be rotated in MongoDB
      # Atlas; this file no longer carries a working value.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: "sadminperfectras"
      - key: CLIENT_ORIGIN
        value: "*"
